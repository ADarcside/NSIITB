# Namma Space multiplayer relay. Deploy: npx wrangler deploy (see multiplayer/README.md)
name = "namma-mp"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

# Free plan: Durable Objects must use the SQLite storage backend (this relay stores nothing anyway)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]

[vars]
# Page origins allowed to connect, comma-separated (localhost is always allowed for testing).
# Empty allows any site to use this relay.
ALLOWED_ORIGINS = "https://adarcside.github.io"
