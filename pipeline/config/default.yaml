# Namma Space - Default Reconstruction Pipeline Configuration
# Hash of this file is recorded in every run_report.json

validate:
  min_duration_s: 90
  min_height_px: 1080

frames:
  candidate_fps: 4
  blur_factor: 0.6
  keep_min: 150
  keep_max: 600
  keep_target: [200, 400]

colmap:
  use_gpu: false          # CPU SIFT (VLFeat, BSD). GPU SIFT is SiftGPU, non-commercial licence: keep off
  camera_model: SIMPLE_RADIAL
  mapper: global          # global (COLMAP 4.x global_mapper) or incremental
  timeout_s: 21600        # per COLMAP command (6 h); only a guard against a hung process
  matcher: exhaustive
  min_registered_ratio: 0.95
  max_reproj_px: 1.0
  min_largest_component_ratio: 0.8

train:
  trainer: splatfacto
  iterations: 30000
  holdout_every: 8
  psnr_target_db: 24
  psnr_gate: warn

normalize:
  floor_band_fraction: 0.25
  max_floor_rms_m: 0.03
  max_scale_error_pct: 2.0
  min_opacity: 0.05
  scale_outlier_multiple: 6.0
  scale_outlier_min_m: 1.0     # only drop a big Gaussian if it is also over this size: plain floors/ceilings use large ones
  room_dims_warn_pct: 5.0      # limit for length/width/ceiling scale estimates disagreeing with their median
  room_dims_gate: fail         # fail (stop the run) or warn; room 2 disagreed by 46% and passed on a warning
  path_gate: fail              # fail or warn: the walked camera path must fit inside the taped room
  path_span_tol_pct: 5.0       # allowed overshoot of the path span over the taped length/width
  room_box_pad_m: 0.3

compress:
  spz_version: 3
  lite_fraction: 0.4
  max_full_mb: 100
  max_lite_mb: 30

floaters:                     # automatic floater filter in S06 (pipeline/floaters.py); never crops by position
  enabled: true
  faint_opacity: 0.05         # stage A candidates: opacity below this
  outside_pad_m: 0.3          # stage A: centre this far past walls, floor or ceiling (walls are drawn by splats centred outside, the put-back check keeps those)
  oversize_m: 0.5             # stage A: largest axis above this
  walk_fog_y_m: [0.25, 1.7]   # stage B: over a walkable cell in this height band; both air rules start at 0.25 m (lower down are shoes and floor clutter, not floaters)
  free_air_dist_m: 0.15       # stage B: this far from every occupied grid layer cell
  free_air_wall_m: 0.1
  free_air_ceiling_m: 0.1
  put_back_px: 1.0            # a candidate that would fill more than this many see-through pixels in any view goes back
  refine: true                # second look at put-backs hidden behind other put-backs (junk behind a wall that was itself a candidate)
  view_step_m: 0.6            # one viewpoint per 0.6 m of walkable floor; raise to trade coverage for time at the finale
  heights_m: [0.6, 1.5, 2.3]
  render_px: 256
  max_hole_pct: 0.05          # verify gate per view
  max_changed_pct: 5.0        # verify gate per view
  prune_unseen: false         # removing never-seen splats is not floater removal; keep off

floor:                        # floor backing in S06 (pipeline/floor.py): clears the low-angle floor fog
  enabled: false              # SAFE ZONE: off by default, the backing is an added sheet (rules: removal only)
  backing_y_m: -0.012         # opaque sheet just under the floor, coloured from the top-down view of the floor
  backing_step_m: 0.01
  backing_sigma_m: 0.007
  floor_band_m: [-0.03, 0.03] # Gaussians that make the floor surface (colour source)
  remove_below_m: 0.02        # below-floor Gaussians inside the walls are candidates; the put-back check keeps any that still fill a hole
  wall_margin_m: 0.05
  view_step_m: 0.6
  max_hole_pct: 0.05

floor_paint:                  # floor repaint in S06 (pipeline/floor_paint.py): paints the floor sheet from the photos
  enabled: false              # SAFE ZONE: painted sheet off (rules: no painting)
  paint_step_m: 0.007
  paint_sigma_m: 0.005
  occluder_opacity: 0.5       # solid splats above the floor that hide it from a photo
  top_views: 6                # median of the best views per floor spot

grid:
  cell_m: 0.05
  height_band_m: [0.2, 1.7]
  n_min: 3
  agent_radius_m: 0.25
  occupied_opacity_sum: 6.0   # a 5 cm cell is blocked when its Gaussians' opacities in the height band add up to this
  min_opacity: 0.2            # fainter Gaussians are ignored for collision
  min_obstacle_m2: 0.05       # smaller blobs are floaters, not furniture
  min_free_m2: 1.0            # less walkable area than this = grid not trusted, ghost mode only
  layers:                     # height slices for flying/crouching (Q/E) over and between furniture
    y0_m: 0.1
    dy_m: 0.1
    top_m: 2.9
    occupied_opacity_sum: 1.5 # per 10 cm slice of a 5 cm cell
    min_opacity: 0.2
    min_obstacle_m2: 0.02
    tall_min_layers: 4        # solid in 4+ stacked slices (0.4 m) = rod or post: kept even if only a cell wide
