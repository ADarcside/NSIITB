# Room 3, SAFE-ZONE CONFIG (owner, 22 Nov): only automatic steps that REMOVE bad splats (floater filter, floor clean-up).
# No hand-picked boxes, panels or colours, and ceiling/wall sheets are off. Floor repaint is the one grey item that is
# still on (published on K-720 17 Nov); see PR text. Dense Room 3 frames (lab.yaml with more photos).
# Use: --config pipeline/config/room3/lab_dense_auto.yaml --run-dir runs/room3_v5 (a fresh run: new frames need new poses)
# Same as room.yaml plus scale regularization in training (room_v2 retrain, 29 Oct).
# Namma Space - Large room configuration (15-55 min walkthrough, 1200-1400 frames)
# Use: --config pipeline/config/room.yaml
# Hash of this file is recorded in every run_report.json

validate:
  min_duration_s: 90
  min_height_px: 1080

frames:
  skip_ranges: ["33:41-33:49", "50:22-50:29"]  # feet in shot, thumb over the lens (this video only)
  candidate_fps: 2           # 51 min video: ~6,150 candidates, ~4,080 sharp (room3_v1)
  extract_at_max_width: true # candidates scaled to --max-width while extracting: ~4 GB temp instead of ~16 GB
  blur_factor: 0.6
  keep_min: 150
  keep_max: 2400
  keep_target: [2200, 2400] # spread evenly over the whole video (uniform subsample); covers waist/chest/head/overhead passes

colmap:
  use_gpu: false          # CPU SIFT (VLFeat, BSD). GPU SIFT is SiftGPU, non-commercial licence: keep off
  reuse_existing: false
  camera_model: SIMPLE_RADIAL
  mapper: global          # global (COLMAP 4.x global_mapper) or incremental
  timeout_s: 43200        # per COLMAP command (12 h: 2,400 frames, exhaustive matching); only a guard against a hung process
  matcher: exhaustive      # table test: 466 frames matched in ~5 min on the A4000; robust to revisited walls
  sequential_overlap: 20   # used only if matcher: sequential
  min_registered_ratio: 0.95
  max_reproj_px: 1.0
  min_largest_component_ratio: 0.8

train:
  trainer: splatfacto
  iterations: 50000         # more frames: each photo is still seen about as often as with 1,400 frames at 30k
  holdout_every: 8
  psnr_target_db: 24
  psnr_gate: warn
  # Room retrain: penalise needle-shaped Gaussians (spiky streaks at the AC vent, curtain, ceiling)
  # bilateral grid: learns each photo's own brightness/colour shift (phone darkens when facing the bright window),
  # so the room keeps one colour instead of haze and dark smears covering the difference. Built into nerfstudio 1.1.5.
  # uint8 image cache: nerfstudio caches every photo in RAM as float32 (2,400 x 1920 px = ~60 GB); uint8 is ~15 GB
  model_args: ["--pipeline.model.use-scale-regularization", "True", "--pipeline.model.use-bilateral-grid", "True",
               "--pipeline.datamanager.cache-images-type", "uint8"]

normalize:
  floor_band_fraction: 0.25
  floor_mode: camera_path       # strongest layer under the walked path (band = old bottom-band fit)
  max_floor_rms_m: 0.03
  max_scale_error_pct: 2.0
  cleanup: false               # keep every Gaussian: any crop (even 0.8 m past the walls) opened black holes in walls/curtain; viewer bounds keep you inside
  min_opacity: 0.05
  scale_outlier_multiple: 6.0
  scale_outlier_min_m: 1.0     # only drop a big Gaussian if it is also over this size: plain floors/ceilings use large ones
  room_dims_warn_pct: 5.0      # warn when wall-to-wall distance disagrees with capture room_dims_m
  room_dims_mode: walls         # walls | scale | off. Median of ceiling/length/width scale estimates
  room_box_pad_m: 0.8          # crop 0.8 m past the walls: a tighter cut eats wall/door Gaussians (black holes); bounds still stop at the walls

compress:
  spz_version: 3
  lite_fraction: 0.12         # lite = first load and the slow-device scene (~240k of 2.0M Gaussians, ~5 MB)
  max_full_mb: 100
  max_lite_mb: 30

floaters:                     # automatic floater filter in S06 (pipeline/floaters.py); never crops by position
  enabled: true
  faint_opacity: 0.05         # stage A candidates: opacity below this
  outside_pad_m: 0.3          # stage A: centre this far past walls, floor or ceiling (walls are drawn by splats centred outside, the put-back check keeps those)
  oversize_m: 0.5             # stage A: largest axis above this
  walk_fog_y_m: [0.25, 1.7]   # stage B: over a walkable cell in this height band; both air rules start at 0.25 m (lower down are shoes and floor clutter, not floaters)
  free_air_dist_m: 0.15       # stage B: this far from every occupied grid layer cell
  free_air_wall_m: 0.1
  free_air_ceiling_m: 0.1
  put_back_px: 1.0            # a candidate that would fill more than this many see-through pixels in any view goes back
  refine: true                # second look at put-backs hidden behind other put-backs (junk behind a wall that was itself a candidate)
  view_step_m: 0.6            # one viewpoint per 0.6 m of walkable floor; raise to trade coverage for time at the finale
  heights_m: [0.6, 1.5, 2.3]
  render_px: 256
  max_hole_pct: 0.05          # verify gate per view
  max_changed_pct: 5.0        # verify gate per view
  prune_unseen: false         # removing never-seen splats is not floater removal; keep off
  unsupported: true           # Room 3: remove solid blobs floating at chest height (nothing hangs there, user 20 Nov)

floor:                        # floor backing in S06 (pipeline/floor.py): clears the low-angle floor fog
  enabled: false              # SAFE ZONE: off by default, the backing is an added sheet (rules: removal only)
  backing_y_m: -0.012         # opaque sheet just under the floor, coloured from the top-down view of the floor
  backing_step_m: 0.01
  backing_sigma_m: 0.007
  floor_band_m: [-0.03, 0.03] # Gaussians that make the floor surface (colour source)
  remove_below_m: 0.02        # below-floor Gaussians inside the walls are candidates; the put-back check keeps any that still fill a hole
  wall_margin_m: 0.05
  view_step_m: 0.6
  max_hole_pct: 0.05

floor_paint:                  # floor repaint in S06 (pipeline/floor_paint.py): paints the floor sheet from the photos
  enabled: false              # SAFE ZONE: painted sheet off (rules: no painting)
  paint_step_m: 0.007
  paint_sigma_m: 0.005
  occluder_opacity: 0.5       # solid splats above the floor that hide it from a photo
  top_views: 6                # median of the best views per floor spot
  skip_if_clean: true         # leave the floor alone when the splat floor already matches this room's photos
  flatten: "off"              # tried 20 Nov (on + even colour): user preferred the photo-painted floor

grid:
  cell_m: 0.05
  height_band_m: [0.2, 1.7]
  n_min: 3
  agent_radius_m: 0.2       # Room 3: 0.6 m aisle between the furniture and the cupboards (0.25 m erodes it); default stays 0.25
  occupied_opacity_sum: 6.0   # a 5 cm cell is blocked when its Gaussians' opacities in the height band add up to this
  min_opacity: 0.2            # fainter Gaussians are ignored for collision
  min_obstacle_m2: 0.05       # smaller blobs are floaters, not furniture
  min_free_m2: 1.0            # less walkable area than this = grid not trusted, ghost mode only
  layers:                     # height slices for flying/crouching (Q/E) over and between furniture
    y0_m: 0.1
    dy_m: 0.1
    top_m: 2.9
    occupied_opacity_sum: 1.5 # per 10 cm slice of a 5 cm cell
    min_opacity: 0.2
    min_obstacle_m2: 0.02
    tall_min_layers: 4        # solid in 4+ stacked slices (0.4 m) = rod or post: kept even if only a cell wide
