<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="dark" />
    <title>Namma Space - 3D Gaussian Splat Walkthrough Viewer</title>
    <meta name="description" content="Zero-install public 3D Gaussian Splatting walkthrough viewer for real spaces." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0c'/%3E%3Cpath d='M7 25V7l18 18V7' fill='none' stroke='%23ffd700' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        color-scheme: dark;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        /* Same colour as the loading screen and the WebGL clear colour (THEME.bg in src/ui/tokens.ts),
           so loading -> empty canvas -> room is one seamless colour */
        background-color: #0a0a0c;
        user-select: none;
        -webkit-user-select: none;
      }
      #viewer-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        cursor: grab;
      }
      #viewer-canvas:active {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <canvas id="viewer-canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
