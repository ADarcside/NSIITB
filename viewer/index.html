<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Namma Space - 3D Gaussian Splat Walkthrough Viewer</title>
    <meta name="description" content="Zero-install public 3D Gaussian Splatting walkthrough viewer for real spaces." />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #020617;
        user-select: none;
        -webkit-user-select: none;
      }
      #viewer-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        cursor: grab;
      }
      #viewer-canvas:active {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <canvas id="viewer-canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
